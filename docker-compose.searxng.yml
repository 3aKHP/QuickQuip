services:
  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: quickquip-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND_ADDRESS:-127.0.0.1}:${SEARXNG_BIND_PORT:-8888}:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:rw
      - ./data/searxng:/var/cache/searxng:rw
    environment:
      FORCE_OWNERSHIP: "${SEARXNG_FORCE_OWNERSHIP:-true}"
      SEARXNG_BASE_URL: "${SEARXNG_PUBLIC_BASE_URL:-http://127.0.0.1:8888/}"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-change-this-secret}"
      SEARXNG_LIMITER: "${SEARXNG_LIMITER:-false}"
