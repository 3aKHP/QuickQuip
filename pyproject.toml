[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quickquip"
version = "1.14.2-dev.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quickquip", "quickquip.*", "plugins", "plugins.*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
"quickquip.sts" = ["*.json"]

[tool.ruff]
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "playwright: requires Playwright browser install (skipped by default)",
    "slow: marks slow tests",
    "network: tests that hit external network (skipped by default)",
]
addopts = [
    "-ra",
    "--strict-markers",
    "-m", "not playwright and not network",
    "--basetemp=/tmp/pytest-quickquip",
]

[tool.coverage.run]
source = ["quickquip"]
omit = [
    "*/__pycache__/*",
    "*/quickquip/adapters/nonebot/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
