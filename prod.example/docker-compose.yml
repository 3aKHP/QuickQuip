name: quickquip

services:
  # SearXNG 不内置于运维模板：请用外部独立 searxng 实例提供搜索能力，
  # 并通过 QUICKQUIP_SEARXNG_BASE_URL 指向它（见 quickquip / web-admin 的 environment）。
  # 面向终端用户的开箱即用自带 searxng 见仓库根目录 docker-compose.example.yml。
  llbot:
    image: initialencounter/llonebot:v7.12.14-7.3.2-45758  # pin 说明见 docs/admin/onebot-adapters.md（latest 已漂移到需授权的 pmhq 8.x）
    container_name: llbot
    entrypoint:
      - /bin/sh
      - -c
      - "(sleep 5 && echo 'nameserver 127.0.0.11' > /etc/resolv.conf && echo 'options ndots:0' >> /etc/resolv.conf) & exec /bin/llonebot-service"
    volumes:
      - ./llbot-qq:/root/.config/QQ
      - ./llbot-data:/root/llonebot
    environment:
      - TZ=Asia/Shanghai
      - QUICK_LOGIN_QQ=${QQ_ACCOUNT:?请设置 QQ 号}
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3080:3080"
    restart: unless-stopped

  quickquip:
    init: true
    build:
      context: ..
      dockerfile: prod/Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}"
        PLAYWRIGHT_BASE_IMAGE: "${PLAYWRIGHT_BASE_IMAGE:-m.daocloud.io/mcr.microsoft.com/playwright/python:v1.58.0-noble}"
    container_name: quickquip
    depends_on:
      - llbot
    env_file:
      - ../.env
    environment:
      DRIVER: "${DRIVER:-~fastapi+~websockets}"
      HOST: "0.0.0.0"
      PORT: "8080"
      ONEBOT_WS_URLS: '${ONEBOT_WS_URLS:-["ws://llbot:3001/"]}'
      ONEBOT_ACCESS_TOKEN: "${ONEBOT_ACCESS_TOKEN:-}"
      SEARXNG_BASE_URL: "${QUICKQUIP_SEARXNG_BASE_URL:?请在 ../.env 设置外部 searxng 地址}"
      PYTHONPATH: "/app/src"
    shm_size: "1gb"
    volumes:
      - ../data:/app/data
      - ../config:/app/config:ro
      - ../llm_about:/app/llm_about:ro
      - ../bot.py:/app/bot.py:ro
      - ../src:/app/src:ro
    restart: unless-stopped

  web-admin:
    init: true
    build:
      context: ..
      dockerfile: prod/Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}"
        PLAYWRIGHT_BASE_IMAGE: "${PLAYWRIGHT_BASE_IMAGE:-m.daocloud.io/mcr.microsoft.com/playwright/python:v1.58.0-noble}"
    container_name: quickquip-web-admin
    command: ["python", "-u", "web_api.py"]
    env_file:
      - ../.env
    environment:
      WEB_ADMIN_HOST: "0.0.0.0"
      WEB_ADMIN_PORT: "5104"
      SEARXNG_BASE_URL: "${QUICKQUIP_SEARXNG_BASE_URL:?请在 ../.env 设置外部 searxng 地址}"
      PYTHONPATH: "/app/src"
    ports:
      - "127.0.0.1:5104:5104"
    volumes:
      - ../data:/app/data
      - ../config:/app/config
      - ../llm_about:/app/llm_about
      - ../frontend/dist:/app/frontend/dist:ro
      - ../web_api.py:/app/web_api.py:ro
      - ../src:/app/src:ro
    restart: unless-stopped
