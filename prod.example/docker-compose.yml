name: quickquip

services:
  env-agent:
    image: quickquip-app:${QUICKQUIP_RELEASE:-latest}
    command: ["python", "-m", "quickquip.environment.transport"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/quickquip-environment/control.sock'); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      QUICKQUIP_ENV_ROOT: /host/project
      QUICKQUIP_ENV_MANAGEMENT_ENABLED: "true"
      QUICKQUIP_ENV_SOCKET: /run/quickquip-environment/control.sock
      QUICKQUIP_ENV_WRITE_SOCKET: /run/quickquip-environment-write/control.sock
    volumes:
      - environment-write:/run/quickquip-environment-write
      - ${QUICKQUIP_ROOT:-..}:/host/project
      - environment-control:/run/quickquip-environment
    restart: unless-stopped

  # 生产模板连接外部独立的 SearXNG 服务，请在根目录 .env 中设置 QUICKQUIP_SEARXNG_BASE_URL。
  # 如需开箱即用的内置 searxng 容器示例，请参考仓库根目录的 docker-compose.example.yml。

  quickquip:
    init: true
    image: quickquip-app:${QUICKQUIP_RELEASE:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}"
        PLAYWRIGHT_BASE_IMAGE: "${PLAYWRIGHT_BASE_IMAGE:-m.daocloud.io/mcr.microsoft.com/playwright/python:v1.58.0-noble}"
    container_name: quickquip
    depends_on:
      env-agent:
        condition: service_healthy
    env_file:
      - ${QUICKQUIP_ENV_FILE:-../.env}
    environment:
      QUICKQUIP_ENV_MANAGEMENT_ENABLED: "true"
      QUICKQUIP_ENV_SOCKET: /run/quickquip-environment/control.sock
      TZ: "${TZ:-Asia/Shanghai}"
      DRIVER: "${DRIVER:-~fastapi+~websockets}"
      HOST: "0.0.0.0"
      PORT: "8080"
      # 正向 WebSocket 填写容器可达的协议端地址。反向 WebSocket 使用空列表。
      ONEBOT_WS_URLS: '${ONEBOT_WS_URLS:-[]}'
      ONEBOT_ACCESS_TOKEN: "${ONEBOT_ACCESS_TOKEN:-}"
      SEARXNG_BASE_URL: "${QUICKQUIP_SEARXNG_BASE_URL:?请在 ../.env 设置外部 searxng 地址}"
      PYTHONPATH: "/app/src"
      QUICKQUIP_MANAGED_CONTAINER: "1"
    shm_size: "1gb"
    volumes:
      - environment-control:/run/quickquip-environment
      - ${QUICKQUIP_ROOT:-..}/data:/app/data
      - ../config:/app/config:ro
      - ${QUICKQUIP_ROOT:-..}/config/managed:/app/config/managed
      - ../llm_about:/app/llm_about:ro
      - ../bot.py:/app/bot.py:ro
      - ../src:/app/src:ro
      # 共享 Skill 目录：位于部署根目录（与 data/ 同级），跨版本发布与容器重建持久保留；
      # Bot 只读挂载，Web Admin 读写挂载以支持后台在线安装与编辑落盘。
      - ${QUICKQUIP_ROOT:-..}/skills:/app/skills:ro
      # 可选宿主机指标视图（供 host-healthcheck Skill 读取）：取消下一行注释以只读挂载 /proc。
      # - /proc:/host/proc:ro
    restart: unless-stopped

  web-admin:
    init: true
    image: quickquip-app:${QUICKQUIP_RELEASE:-latest}
    container_name: quickquip-web-admin
    command: ["python", "-u", "web_api.py"]
    env_file:
      - ${QUICKQUIP_ENV_FILE:-../.env}
    depends_on:
      env-agent:
        condition: service_healthy
    environment:
      QUICKQUIP_ENV_MANAGEMENT_ENABLED: "true"
      QUICKQUIP_ENV_SOCKET: /run/quickquip-environment/control.sock
      QUICKQUIP_ENV_WRITE_SOCKET: /run/quickquip-environment-write/control.sock
      TZ: "${TZ:-Asia/Shanghai}"
      WEB_ADMIN_HOST: "0.0.0.0"
      WEB_ADMIN_PORT: "5104"
      SEARXNG_BASE_URL: "${QUICKQUIP_SEARXNG_BASE_URL:?请在 ../.env 设置外部 searxng 地址}"
      PYTHONPATH: "/app/src"
      QUICKQUIP_MANAGED_CONTAINER: "1"
    ports:
      - "127.0.0.1:5104:5104"
    volumes:
      - environment-write:/run/quickquip-environment-write
      - environment-control:/run/quickquip-environment
      - ${QUICKQUIP_ROOT:-..}/data:/app/data
      - ../config:/app/config
      - ${QUICKQUIP_ROOT:-..}/config/managed:/app/config/managed
      - ../llm_about:/app/llm_about
      - ../frontend/dist:/app/frontend/dist:ro
      - ../web_api.py:/app/web_api.py:ro
      - ../src:/app/src:ro
      # 部署根共享 Skill 目录：Skill 页在线安装/编辑/预置同步在此落盘。
      - ${QUICKQUIP_ROOT:-..}/skills:/app/skills
    restart: unless-stopped

volumes:
  environment-write:
  environment-control:
