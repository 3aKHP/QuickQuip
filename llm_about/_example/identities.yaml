# ── QuickQuip 分群身份词表 ──────────────────────────────────────────────
# 在 llm_about/ 下，将 _example/ 复制为群号目录（如 123456/），再编辑其中的 identities.yaml。
#
# 填写本群要覆盖的身份条目，其余内容继承全局身份表。
# - 全局回退：../identities.yaml
# - 合并规则：同名 canonical_name 以本群为准
# - 常见用途：同一人在不同群的别名不同，在此覆盖 aliases 和 note
#
# 格式与全局一致。

people:
