name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    uses: ./.github/workflows/_tests.yml
    with:
      python-versions: '["3.12"]'

  lazy-package:
    name: Build Windows Lazy Package
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Download embedded Python 3.11
        run: |
          curl -L -o python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          7z x python-embed.zip -ostaging\python

      - name: Enable pip in embedded Python
        run: |
          $pth = "staging\python\python311._pth"
          $lines = Get-Content $pth
          if ($lines -notcontains "..") {
            $lines = @("..") + $lines
          }
          $lines -replace '#import site', 'import site' | Set-Content $pth
          curl -L -o staging\get-pip.py https://bootstrap.pypa.io/get-pip.py
          staging\python\python.exe staging\get-pip.py --no-warn-script-location

      - name: Install Python dependencies
        run: staging\python\python.exe -m pip install --no-warn-script-location -r requirements.txt
        env:
          PIP_NO_CACHE_DIR: "1"
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Install pywebview (Windows-only webview)
        run: staging\python\python.exe -m pip install --no-warn-script-location pywebview
        env:
          PIP_NO_CACHE_DIR: "1"

      - name: Install Playwright browsers
        run: staging\python\python.exe -m playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Copy project files
        run: |
          Copy-Item -Recurse quickquip staging\
          Copy-Item -Recurse plugins staging\
          Copy-Item -Recurse llm_about staging\
          New-Item -ItemType Directory -Force staging\frontend\dist | Out-Null
          Copy-Item -Recurse frontend\dist\* staging\frontend\dist\

          Copy-Item -Recurse config staging\
          Copy-Item bot.py, web_api.py, webview_launcher.py, start.bat, .env.example staging\
          New-Item -ItemType Directory -Force staging\data | Out-Null

      - name: Smoke test lazy package
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          staging\python\python.exe -m compileall -q staging\bot.py staging\web_api.py staging\webview_launcher.py staging\quickquip staging\plugins
          staging\python\python.exe -c "import webview; print('pywebview ok')"
          Push-Location staging
          try {
            .\python\python.exe -c "import quickquip, web_api; print('app import ok')"
            .\python\python.exe -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True); browser.close(); p.stop(); print('playwright chromium ok')"
            Copy-Item .env.example .env -Force
            $env:WEB_ADMIN_PASSWORD = "smoke"
            $env:WEB_ADMIN_HOST = "127.0.0.1"
            $env:WEB_ADMIN_PORT = "55104"
            $stdout = Join-Path (Get-Location) "web-api-smoke.out.log"
            $stderr = Join-Path (Get-Location) "web-api-smoke.err.log"
            $pythonExe = (Resolve-Path .\python\python.exe).Path
            $workDir = (Get-Location).Path
            $proc = Start-Process `
              -FilePath $pythonExe `
              -ArgumentList "-u","web_api.py" `
              -WorkingDirectory $workDir `
              -WindowStyle Hidden `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru
            try {
              $ready = $false
              for ($i = 0; $i -lt 30; $i++) {
                Start-Sleep -Seconds 1
                if ($proc.HasExited) {
                  break
                }
                try {
                  $resp = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:55104/ops/" -TimeoutSec 2
                  if ($resp.StatusCode -eq 200 -and $resp.Content -match '<div id="app"></div>') {
                    $ready = $true
                    break
                  }
                } catch {}
              }
              if (-not $ready) {
                if (Test-Path $stdout) { Get-Content $stdout }
                if (Test-Path $stderr) { Get-Content $stderr }
                throw "Web Admin smoke test failed"
              }
            } finally {
              if ($proc -and -not $proc.HasExited) {
                Stop-Process -Id $proc.Id -Force
              }
            }
          } finally {
            Pop-Location
          }

      - name: Create release zip
        run: 7z a QuickQuip-${{ github.ref_name }}-windows-x64.zip .\staging\*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazy-package
          path: QuickQuip-${{ github.ref_name }}-windows-x64.zip

  docker-image:
    name: Build and Push Docker Image
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/3akhp/quickquip
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: quickquip:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        run: |
          docker run --rm quickquip:smoke sh -euxc 'test -f /app/frontend/dist/index.html && test -f /app/llm_about/vocab.yaml.example && docker --version && python -m compileall -q bot.py web_api.py quickquip plugins'
          docker run --rm --shm-size=1g quickquip:smoke python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True, args=['--no-sandbox']); browser.close(); p.stop()"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    needs: [tests, lazy-package, docker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download lazy package artifact
        uses: actions/download-artifact@v4
        with:
          name: lazy-package

      - name: Extract release notes from CHANGELOG
        run: python scripts/ci/extract_release_notes.py "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: QuickQuip-*.zip
