name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  tests:
    uses: ./.github/workflows/_tests.yml
    with:
      python-versions: '["3.12"]'

  artifacts:
    needs: tests
    uses: ./.github/workflows/_release-artifacts.yml
    permissions:
      contents: read
    with:
      release-tag: ${{ github.ref_name }}

  docker-image:
    name: Build and Push Docker Image
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/3akhp/quickquip
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Download verified image
        uses: actions/download-artifact@v8
        with:
          name: verified-release-image
          digest-mismatch: error

      - name: Verify and load accepted image
        run: |
          sha256sum --check release-image.sha256
          zstd -dc release-image.tar.zst | docker load
          python3 scripts/ci/verify_release_image.py

      - name: Publish accepted image
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag quickquip:smoke "$tag"
            docker push "$tag"
          done <<< "$PUBLISH_TAGS"

  release:
    name: Create Release
    needs: [tests, artifacts, docker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download lazy package artifact
        uses: actions/download-artifact@v8
        with:
          name: lazy-package
          digest-mismatch: error

      - name: Extract release notes from CHANGELOG
        run: python scripts/ci/extract_release_notes.py "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: QuickQuip-*.zip
