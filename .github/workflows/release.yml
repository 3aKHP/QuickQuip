name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    uses: ./.github/workflows/_tests.yml
    with:
      python-versions: '["3.12"]'

  lazy-package:
    name: Build Windows Lazy Package
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Download embedded Python 3.11
        run: |
          curl -L -o python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          7z x python-embed.zip -ostaging\python

      - name: Enable pip in embedded Python
        run: |
          (Get-Content staging\python\python311._pth) -replace '#import site', 'import site' | Set-Content staging\python\python311._pth
          curl -L -o staging\get-pip.py https://bootstrap.pypa.io/get-pip.py
          staging\python\python.exe staging\get-pip.py --no-warn-script-location

      - name: Install Python dependencies
        run: staging\python\python.exe -m pip install --no-warn-script-location -r requirements.txt
        env:
          PIP_NO_CACHE_DIR: "1"

      - name: Install pywebview (Windows-only webview)
        run: staging\python\python.exe -m pip install --no-warn-script-location pywebview
        env:
          PIP_NO_CACHE_DIR: "1"

      - name: Copy project files
        run: |
          Copy-Item -Recurse quickquip staging\
          Copy-Item -Recurse plugins staging\
          Copy-Item -Recurse llm_about staging\
          mkdir -p staging\frontend\dist
          Copy-Item -Recurse frontend\dist\* staging\frontend\dist\

          Copy-Item -Recurse config staging\
          Copy-Item bot.py, web_api.py, 启动.bat, webview_launcher.py staging\
          mkdir staging\data

      - name: Create release zip
        run: 7z a QuickQuip-${{ github.ref_name }}-windows-x64.zip .\staging\*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazy-package
          path: QuickQuip-${{ github.ref_name }}-windows-x64.zip

  docker-image:
    name: Build and Push Docker Image
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    needs: [tests, lazy-package, docker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download lazy package artifact
        uses: actions/download-artifact@v4
        with:
          name: lazy-package

      - name: Extract release notes from CHANGELOG
        run: python scripts/ci/extract_release_notes.py "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: QuickQuip-*.zip
