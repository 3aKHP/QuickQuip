name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  tests:
    uses: ./.github/workflows/_tests.yml
    with:
      python-versions: '["3.12"]'

  lazy-package:
    name: Build Windows Lazy Package
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Download embedded Python 3.11
        run: |
          curl -L -o python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          7z x python-embed.zip -ostaging\python

      - name: Enable pip in embedded Python
        run: |
          $pth = "staging\python\python311._pth"
          $lines = Get-Content $pth
          if ($lines -notcontains "..") {
            $lines = @("..") + $lines
          }
          $lines -replace '#import site', 'import site' | Set-Content $pth
          curl -L -o staging\get-pip.py https://bootstrap.pypa.io/get-pip.py
          staging\python\python.exe staging\get-pip.py --no-warn-script-location

      - name: Install Python dependencies
        run: staging\python\python.exe -m pip install --no-warn-script-location -r requirements.txt
        env:
          PIP_NO_CACHE_DIR: "1"
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Install pywebview (Windows-only webview)
        run: staging\python\python.exe -m pip install --no-warn-script-location pywebview
        env:
          PIP_NO_CACHE_DIR: "1"

      - name: Install Playwright browsers
        run: staging\python\python.exe -m playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Copy project files
        run: |
          Copy-Item -Recurse src\quickquip staging\
          Copy-Item -Recurse src\plugins staging\
          Copy-Item -Recurse llm_about staging\
          New-Item -ItemType Directory -Force staging\frontend\dist | Out-Null
          Copy-Item -Recurse frontend\dist\* staging\frontend\dist\

          Copy-Item -Recurse config staging\
          Copy-Item bot.py, web_api.py, webview_launcher.py, start.bat, .env.example staging\
          New-Item -ItemType Directory -Force staging\data | Out-Null

      - name: Verify lazy package template manifest
        shell: pwsh
        run: |
          # start.bat 首启依赖的模板清单：copy_if_missing 对缺失源静默跳过，
          # 这里在打包前钉住"模板都在 staging 里"（对齐 Docker smoke 的 test -f 思路）。
          $expected = @(
            "staging\start.bat", "staging\.env.example",
            "staging\config\llm.toml.example", "staging\config\chat_rules.toml.example",
            "staging\config\generation.toml.example", "staging\config\games.toml.example",
            "staging\config\awakening.toml.example", "staging\config\sensitive_words.toml.example",
            "staging\config\niuniu_text.toml.example", "staging\config\niuniu_text_safe.toml.example",
            "staging\config\niuniu_text.toml", "staging\config\niuniu_text_safe.toml",
            "staging\config\personas.example\_shared.toml", "staging\config\personas.example\private-persona.toml",
            "staging\config\personas.example\quickquip-default.toml", "staging\config\personas.example\structured.toml",
            "staging\llm_about\vocab.yaml.example", "staging\llm_about\identities.yaml.example"
          )
          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw "Lazy package missing template files: $($missing -join ', ')" }
          # 负向断言：包内不得存在实例化 .env（会让 start.bat 首启门控失效，
          # rc.1 的打包污染正是 smoke 在 staging 内跑出来的 .env 混入了 zip）。
          if (Test-Path "staging\.env") { throw "staging must not contain an instantiated .env before zipping" }

      - name: Create release zip
        run: 7z a QuickQuip-${{ github.ref_name }}-windows-x64.zip .\staging\*

      - name: Audit release zip contents
        shell: pwsh
        run: |
          # 产物级清洁审计（锚定 zip 本身，防步骤序回归）：zip 在 smoke 之前打包，
          # smoke 事后在 staging 里产生的运行残留本就不该进包——这里再对成品兜底。
          # 注意 .env 用精确名匹配：.env.example 与 config\niuniu_text*.toml 是预期内容。
          $listing = 7z l -ba QuickQuip-${{ github.ref_name }}-windows-x64.zip | ForEach-Object { ($_ -split '\s{2,}')[-1] }
          $forbidden = @($listing | Where-Object { $_ -match '^\.env$' -or $_ -match '__pycache__' -or $_ -match '\.pyc$' -or $_ -match '-smoke\..*\.log$' -or $_ -match '\.db$' })
          if ($forbidden.Count -gt 0) { throw "Release zip contains build residue: $($forbidden -join ', ')" }

      - name: Smoke test lazy package
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          staging\python\python.exe -m compileall -q staging\bot.py staging\web_api.py staging\webview_launcher.py staging\quickquip staging\plugins
          staging\python\python.exe -c "import webview; print('pywebview ok')"
          Push-Location staging
          try {
            .\python\python.exe -c "import quickquip, plugins, web_api; print('app import ok')"
            .\python\python.exe -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True); browser.close(); p.stop(); print('playwright chromium ok')"
            Copy-Item .env.example .env -Force
            $env:WEB_ADMIN_PASSWORD = "smoke"
            $env:WEB_ADMIN_HOST = "127.0.0.1"
            $env:WEB_ADMIN_PORT = "55104"
            $stdout = Join-Path (Get-Location) "web-api-smoke.out.log"
            $stderr = Join-Path (Get-Location) "web-api-smoke.err.log"
            $pythonExe = (Resolve-Path .\python\python.exe).Path
            $workDir = (Get-Location).Path
            $proc = Start-Process `
              -FilePath $pythonExe `
              -ArgumentList "-u","web_api.py" `
              -WorkingDirectory $workDir `
              -WindowStyle Hidden `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru
            try {
              $ready = $false
              for ($i = 0; $i -lt 30; $i++) {
                Start-Sleep -Seconds 1
                if ($proc.HasExited) {
                  break
                }
                try {
                  $resp = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:55104/ops/" -TimeoutSec 2
                  if ($resp.StatusCode -eq 200 -and $resp.Content -match '<div id="app"></div>') {
                    $ready = $true
                    break
                  }
                } catch {}
              }
              if (-not $ready) {
                if (Test-Path $stdout) { Get-Content $stdout }
                if (Test-Path $stderr) { Get-Content $stderr }
                throw "Web Admin smoke test failed"
              }
            } finally {
              if ($proc -and -not $proc.HasExited) {
                Stop-Process -Id $proc.Id -Force
              }
            }
          } finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lazy-package
          path: QuickQuip-${{ github.ref_name }}-windows-x64.zip

  docker-image:
    name: Build and Push Docker Image
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/3akhp/quickquip
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: quickquip:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        run: |
          docker run --rm quickquip:smoke sh -euxc 'test -f /app/frontend/dist/index.html && test -f /app/llm_about/vocab.yaml.example && docker --version && python -m compileall -q bot.py web_api.py && python -c "import quickquip, plugins, web_api"'
          # 存活探测：bot.py 必须活到 timeout（退出码 124）——import 冒烟抓不到
          # nonebot.load_plugins 的路径约束。勿改成 -euxc：set -e 会让 124 直接
          # 中止 shell，存活判定恒假。
          docker run --rm quickquip:smoke sh -c 'timeout -k 5 15 python -u bot.py; [ $? -eq 124 ]'
          docker run --rm --shm-size=1g quickquip:smoke python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True, args=['--no-sandbox']); browser.close(); p.stop()"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    needs: [tests, lazy-package, docker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download lazy package artifact
        uses: actions/download-artifact@v8
        with:
          name: lazy-package
          digest-mismatch: error

      - name: Extract release notes from CHANGELOG
        run: python scripts/ci/extract_release_notes.py "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: QuickQuip-*.zip
