name: Tests

# Reusable test workflow invoked by ci.yml (on push/PR) and release.yml (on tag).
# Action references use floating major version tags; the repo should enable
# Dependabot or a similar auto-pinner to replace them with commit SHAs.

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON-encoded list of Python versions to test against.
        type: string
        default: '["3.11", "3.12"]'
      run-frontend:
        description: Whether to run the frontend build job.
        type: boolean
        default: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Validate example configs
        run: python scripts/ci/validate_toml_examples.py

      - name: Check ID literals
        run: python scripts/ci/check_id_literals.py

      - name: Seed test chat rules
        run: cp config/chat_rules.toml.example config/chat_rules.toml

      - name: Run tests
        run: pytest --cov --cov-report=xml --cov-report=term -n auto

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend build
    if: ${{ inputs.run-frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build
