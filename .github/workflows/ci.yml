name: CI

# push: dev 与 pull_request 合并到 dev 时会各触发一次（concurrency group 不同），
# 这是已知权衡——dev 允许 chore/docs 直接 push，需要 push 触发器覆盖这类绕过 PR 的改动。
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_tests.yml

  windows-config:
    name: Windows configuration lifecycle
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Verify configuration initialization and backup/restore
        run: >-
          python -m pytest tests/unit/llm/test_config_service.py
          tests/unit/llm/test_config_cli_encoding.py
          --basetemp "${{ runner.temp }}/pytest-quickquip"
          -k "two_processes_initialize_one_database or backup_is_consistent_and_restore_clears_leases or config_cli_emits_utf8"
      - name: Verify TOML workspaces and local recovery
        run: >-
          python -m pytest tests/unit/config_workspace
          --basetemp "${{ runner.temp }}/pytest-config-workspace"
      - name: Verify native service control and offline publication
        run: >-
          python -m pytest tests/unit/configuration/test_process_control.py
          tests/unit/llm/test_config_deployment.py
          tests/integration/test_native_web_lifecycle.py
          --basetemp "${{ runner.temp }}/pytest-config-activation"
      - name: Verify directional configuration sessions
        run: >-
          python -m pytest tests/unit/config_sync/test_session.py
          tests/unit/config_sync/test_installation.py tests/unit/config_sync/test_reconciliation.py
          --basetemp "${{ runner.temp }}/pytest-qqsync"
      - name: Verify tracked deployment client and private connection settings
        run: >-
          python -m pytest tests/unit/scripts/test_deployment_clients.py
          --basetemp "${{ runner.temp }}/pytest-deployment-clients"
      - name: Smoke packaged maintenance tools
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'maintenance-package'
          New-Item -ItemType Directory -Force "$package/scripts/maintenance" | Out-Null
          Copy-Item -Recurse src/quickquip, skills.example $package
          Copy-Item scripts/maintenance/backfill_chat_archive.py, scripts/maintenance/backfill_record_identities.py, scripts/maintenance/sync_preset_skills.py, scripts/maintenance/reset_niuniu_lengths.py "$package/scripts/maintenance/"
          Push-Location $package
          try {
            python scripts/maintenance/sync_preset_skills.py --apply
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Skill sync failed' }
            python scripts/maintenance/sync_preset_skills.py --check
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Skill contents differ' }
            python scripts/maintenance/reset_niuniu_lengths.py --help
            if ($LASTEXITCODE -ne 0) { throw 'Packaged niuniu reset helper failed' }
            python scripts/maintenance/backfill_record_identities.py --help
            if ($LASTEXITCODE -ne 0) { throw 'Packaged identities helper failed' }
            python scripts/maintenance/backfill_chat_archive.py --dry-run
            if ($LASTEXITCODE -ne 0) { throw 'Packaged archive helper failed' }
          } finally { Pop-Location }

  docker-config:
    name: Docker configuration lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build application smoke image
        run: >-
          docker build -f docker/Dockerfile.prod -t quickquip-qqsync-smoke
          --build-arg PLAYWRIGHT_BASE_IMAGE=python:3.12-slim
          --build-arg PIP_INDEX_URL=https://pypi.org/simple
          --build-arg PIP_TRUSTED_HOST=pypi.org .
      - name: Verify legacy Compose Dockerfile reference
        run: |
          mkdir -p prod
          cp docker/Dockerfile.prod prod/Dockerfile
          docker build -f prod/Dockerfile -t quickquip-qqsync-smoke \
            --build-arg PLAYWRIGHT_BASE_IMAGE=python:3.12-slim \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            --build-arg PIP_TRUSTED_HOST=pypi.org .
      - name: Verify real Compose synchronization
        env:
          QUICKQUIP_DOCKER_SMOKE: "1"
        run: >-
          sudo --preserve-env=QUICKQUIP_DOCKER_SMOKE
          "$(command -v python)" -m pytest tests/integration/test_docker_config_sync.py
          --basetemp "${{ runner.temp }}/pytest-docker-config"
