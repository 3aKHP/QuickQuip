name: CI

# push: dev 与 pull_request 合并到 dev 时会各触发一次（concurrency group 不同），
# 这是已知权衡——dev 允许 chore/docs 直接 push，需要 push 触发器覆盖这类绕过 PR 的改动。
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_tests.yml

  windows-config:
    name: Windows configuration lifecycle
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Verify configuration initialization and backup/restore
        run: >-
          python -m pytest tests/unit/llm/test_config_service.py
          tests/unit/llm/test_config_cli_encoding.py
          --basetemp "${{ runner.temp }}/pytest-quickquip"
          -k "two_processes_initialize_one_database or backup_is_consistent_and_restore_clears_leases or config_cli_emits_utf8"
