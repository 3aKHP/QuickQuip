name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Validate example configs
        run: |
          python - <<'EOF'
          import tomllib, pathlib, sys
          files = (
              list(pathlib.Path('config').glob('*.toml.example')) +
              list(pathlib.Path('config/personas.example').glob('*.toml'))
          )
          for f in files:
              try:
                  tomllib.loads(f.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f"FAIL {f}: {e}", file=sys.stderr)
                  sys.exit(1)
          print(f"OK ({len(files)} files)")
          EOF

      - name: Set up test config
        run: cp config/chat_rules.toml.example config/chat_rules.toml

      - name: Run timezone tests
        run: python test_tz.py

      - name: Run LLM tests
        run: python test_llm.py

      - name: Run Tieba tests
        run: python test_tieba.py

      - name: Run defectify tests
        run: python test_defectify.py

      - name: Run briefing tests
        run: python test_briefing.py
