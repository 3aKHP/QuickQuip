name: Release artifacts

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lazy-package:
    name: Build Windows Lazy Package
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Record candidate identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/ci/release_identity.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Download embedded Python 3.11
        run: |
          curl -L -o python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          7z x python-embed.zip -ostaging\python

      - name: Enable pip in embedded Python
        run: |
          $pth = "staging\python\python311._pth"
          $lines = Get-Content $pth
          if ($lines -notcontains "..") {
            $lines = @("..") + $lines
          }
          $lines -replace '#import site', 'import site' | Set-Content $pth
          curl -L -o staging\get-pip.py https://bootstrap.pypa.io/get-pip.py
          staging\python\python.exe staging\get-pip.py --no-warn-script-location

      - name: Install Python dependencies
        run: staging\python\python.exe -m pip install --no-warn-script-location -r requirements.txt
        env:
          PIP_NO_CACHE_DIR: "1"
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Install pywebview (Windows-only webview)
        run: staging\python\python.exe -m pip install --no-warn-script-location pywebview
        env:
          PIP_NO_CACHE_DIR: "1"

      - name: Install Playwright browsers
        run: staging\python\python.exe -m playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Install QuickQuip project
        run: |
          staging\python\python.exe -m pip install --no-warn-script-location "setuptools>=68" wheel
          if ($LASTEXITCODE -ne 0) { throw "QuickQuip build dependencies installation failed" }
          # Embedded Python uses ._pth; build with the installed backend.
          staging\python\python.exe -m pip install --no-deps --no-build-isolation --no-warn-script-location .
        env:
          PIP_NO_CACHE_DIR: "1"

      - name: Copy project files
        run: |
          Copy-Item -Recurse src\quickquip staging\
          Copy-Item -Recurse src\plugins staging\
          Copy-Item -Recurse llm_about staging\
          New-Item -ItemType Directory -Force staging\frontend\dist | Out-Null
          Copy-Item -Recurse frontend\dist\* staging\frontend\dist\

          Copy-Item -Recurse config staging\
          Copy-Item -Recurse skills.example staging\
          Copy-Item bot.py, web_api.py, webview_launcher.py, start.bat, .env.example staging\
          New-Item -ItemType Directory -Force staging\scripts\maintenance | Out-Null
          Copy-Item scripts\maintenance\backfill_chat_archive.py, scripts\maintenance\backfill_record_identities.py, scripts\maintenance\sync_preset_skills.py, scripts\maintenance\reset_niuniu_lengths.py staging\scripts\maintenance\
          New-Item -ItemType Directory -Force staging\data | Out-Null

      - name: Verify lazy package template manifest
        shell: pwsh
        run: |
          # start.bat 首启依赖的模板清单：copy_if_missing 对缺失源静默跳过，
          # 这里在打包前钉住"模板都在 staging 里"（对齐 Docker smoke 的 test -f 思路）。
          $expected = @(
            "staging\start.bat", "staging\.env.example", "staging\scripts\maintenance\backfill_chat_archive.py", "staging\scripts\maintenance\backfill_record_identities.py",
            "staging\scripts\maintenance\sync_preset_skills.py", "staging\scripts\maintenance\reset_niuniu_lengths.py",
            "staging\config\llm.json.example", "staging\config\llm.toml.example", "staging\config\chat_rules.toml.example",
            "staging\config\generation.toml.example", "staging\config\games.toml.example",
            "staging\config\awakening.toml.example", "staging\config\sensitive_words.toml.example",
            "staging\config\niuniu_text.toml.example", "staging\config\niuniu_text_safe.toml.example",
            "staging\config\niuniu_text.toml", "staging\config\niuniu_text_safe.toml",
            "staging\config\personas.example\_shared.toml", "staging\config\personas.example\private-persona.toml",
            "staging\config\personas.example\quickquip-default.toml", "staging\config\personas.example\structured.toml",
            "staging\llm_about\vocab.yaml.example", "staging\llm_about\identities.yaml.example",
            "staging\skills.example\self-docs\SKILL.md", "staging\skills.example\host-healthcheck\SKILL.md"
          )
          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw "Lazy package missing template files: $($missing -join ', ')" }
          # 负向断言：包内不得存在实例化 .env（会让 start.bat 首启门控失效，
          # rc.1 的打包污染正是 smoke 在 staging 内跑出来的 .env 混入了 zip）。
          if (Test-Path "staging\.env") { throw "staging must not contain an instantiated .env before zipping" }

      - name: Create release zip
        run: 7z a QuickQuip-${{ steps.identity.outputs.label }}-windows-x64.zip .\staging\*

      - name: Audit release zip contents
        shell: pwsh
        run: |
          # 产物级清洁审计（锚定 zip 本身，防步骤序回归）：zip 在 smoke 之前打包，
          # smoke 事后在 staging 里产生的运行残留本就不该进包——这里再对成品兜底。
          # 注意 .env 用精确名匹配：.env.example 与 config\niuniu_text*.toml 是预期内容。
          # python\ 前缀是内嵌运行时（pip install 编译的字节码属正常内容），只审计应用区。
          $listing = 7z l -ba QuickQuip-${{ steps.identity.outputs.label }}-windows-x64.zip | ForEach-Object { ($_ -split '\s{2,}')[-1] }
          $appEntries = @($listing | Where-Object { $_ -notlike 'python\*' })
          $forbidden = @($appEntries | Where-Object { $_ -match '^\.env$' -or $_ -match '__pycache__' -or $_ -match '\.pyc$' -or $_ -match '-smoke\..*\.log$' -or $_ -match '\.db$' })
          if ($forbidden.Count -gt 0) { throw "Release zip contains build residue: $($forbidden -join ', ')" }

      - name: Extract candidate ZIP for smoke tests
        run: 7z x QuickQuip-${{ steps.identity.outputs.label }}-windows-x64.zip -overified

      - name: Smoke test lazy package
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          verified\python\python.exe -m compileall -q verified\bot.py verified\web_api.py verified\webview_launcher.py verified\quickquip verified\plugins
          verified\python\python.exe -c "import webview; print('pywebview ok')"
          verified\python\python.exe -c "from importlib.metadata import version; from pathlib import Path; from packaging.version import Version; import tomllib; expected = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; assert Version(version('quickquip')) == Version(expected); print('QuickQuip installed version ok')"
          if ($LASTEXITCODE -ne 0) { throw "QuickQuip package version smoke test failed" }
          Push-Location verified
          try {
            .\python\python.exe -m quickquip.llm.config_cli init
            if ($LASTEXITCODE -ne 0) { throw "Configuration database initialization failed" }
            .\python\python.exe -m quickquip.llm.config_cli validate
            if ($LASTEXITCODE -ne 0) { throw "Configuration database validation failed" }
            .\python\python.exe -m quickquip.llm.config_cli validate config\llm.json.example
            if ($LASTEXITCODE -ne 0) { throw "Configuration JSON example validation failed" }
            .\python\python.exe -c "import quickquip, plugins, web_api; from importlib.metadata import version; from quickquip.llm.client_fingerprints.identity import client_version; assert client_version() == version('quickquip'); print('app import and client version ok')"
            if ($LASTEXITCODE -ne 0) { throw "Application import and client version smoke test failed" }
            .\python\python.exe scripts\maintenance\sync_preset_skills.py --apply --skills-dir data\preset-sync-smoke
            if ($LASTEXITCODE -ne 0) { throw "Preset Skill sync startup smoke test failed" }
            .\python\python.exe scripts\maintenance\sync_preset_skills.py --check --skills-dir data\preset-sync-smoke
            if ($LASTEXITCODE -ne 0) { throw "Preset Skill sync contents smoke test failed" }
            .\python\python.exe scripts\maintenance\reset_niuniu_lengths.py --help
            if ($LASTEXITCODE -ne 0) { throw "Niuniu reset helper startup smoke test failed" }
            .\python\python.exe scripts\maintenance\backfill_record_identities.py --help
            if ($LASTEXITCODE -ne 0) { throw "Record identities script startup smoke test failed" }
            New-Item -ItemType Directory -Force data\daily_msgs\10001 | Out-Null
            '{"sender":"smoke","text":"backfill ok","ts":1788998400.0,"user_id":"1"}' | Set-Content -Encoding utf8 data\daily_msgs\10001\2026-09-10.jsonl
            .\python\python.exe scripts\maintenance\backfill_chat_archive.py --dry-run
            if ($LASTEXITCODE -ne 0) { throw "Chat archive dry-run smoke test failed" }
            .\python\python.exe scripts\maintenance\backfill_chat_archive.py
            if ($LASTEXITCODE -ne 0) { throw "Chat archive backfill smoke test failed" }
            .\python\python.exe -c "from quickquip.chat.archive import ChatArchive; assert ChatArchive().stats()['messages'] == 1; print('chat archive backfill ok')"
            if ($LASTEXITCODE -ne 0) { throw "Chat archive contents smoke test failed" }
            .\python\python.exe -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True); browser.close(); p.stop(); print('playwright chromium ok')"
            Copy-Item .env.example .env -Force
            $env:WEB_ADMIN_PASSWORD = "smoke"
            $env:WEB_ADMIN_HOST = "127.0.0.1"
            $env:WEB_ADMIN_PORT = "55104"
            $stdout = Join-Path (Get-Location) "web-api-smoke.out.log"
            $stderr = Join-Path (Get-Location) "web-api-smoke.err.log"
            $pythonExe = (Resolve-Path .\python\python.exe).Path
            $workDir = (Get-Location).Path
            $proc = Start-Process `
              -FilePath $pythonExe `
              -ArgumentList "-u","web_api.py" `
              -WorkingDirectory $workDir `
              -WindowStyle Hidden `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru
            try {
              $ready = $false
              for ($i = 0; $i -lt 30; $i++) {
                Start-Sleep -Seconds 1
                if ($proc.HasExited) {
                  break
                }
                try {
                  $resp = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:55104/ops/" -TimeoutSec 2
                  if ($resp.StatusCode -eq 200 -and $resp.Content -match '<div id="app"></div>') {
                    $ready = $true
                    break
                  }
                } catch {}
              }
              if (-not $ready) {
                if (Test-Path $stdout) { Get-Content $stdout }
                if (Test-Path $stderr) { Get-Content $stderr }
                throw "Web Admin smoke test failed"
              }
            } finally {
              if ($proc -and -not $proc.HasExited) {
                Stop-Process -Id $proc.Id -Force
              }
            }
          } finally {
            Pop-Location
          }

      - name: Checkout upgrade baseline
        uses: actions/checkout@v7
        with:
          ref: v1.16.3
          path: baseline

      - name: Verify extracted package upgrade and rollback
        shell: pwsh
        run: |
          7z x QuickQuip-${{ steps.identity.outputs.label }}-windows-x64.zip -oupgrade-package
          if ($LASTEXITCODE -ne 0) { throw 'Candidate extraction failed' }
          python scripts/ci/verify_release_upgrade.py --baseline baseline --installation upgrade-package --python upgrade-package/python/python.exe
          if ($LASTEXITCODE -ne 0) { throw 'Candidate upgrade acceptance failed' }
          & upgrade-package/python/python.exe -m pip freeze | Out-File -Encoding utf8 release-dependencies.txt
          Get-FileHash QuickQuip-${{ steps.identity.outputs.label }}-windows-x64.zip -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 release-checksum.txt

      - name: Retain Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-evidence
          path: |
            release-identity.json
            release-dependencies.txt
            release-checksum.txt
            upgrade-package/data/release-*.log
            upgrade-package/data/release-*.json
            verified/web-api-smoke.*.log

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lazy-package
          path: QuickQuip-${{ steps.identity.outputs.label }}-windows-x64.zip

  docker-image:
    name: Build and Verify Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: quickquip:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        run: |
          docker run --rm quickquip:smoke sh -euxc 'test -f /app/frontend/dist/index.html && test -f /app/llm_about/vocab.yaml.example && docker --version && python -m compileall -q bot.py web_api.py && python -m quickquip.llm.config_cli init && python -m quickquip.llm.config_cli validate config/llm.json.example && python -c "import quickquip, plugins, web_api"'
          docker run --rm quickquip:smoke sh -euxc 'python scripts/maintenance/reset_niuniu_lengths.py --help && python scripts/maintenance/sync_preset_skills.py --apply --skills-dir /tmp/preset-sync-smoke && python scripts/maintenance/sync_preset_skills.py --check --skills-dir /tmp/preset-sync-smoke'
          # 存活探测：bot.py 必须活到 timeout（退出码 124）——import 冒烟抓不到
          # nonebot.load_plugins 的路径约束。勿改成 -euxc：set -e 会让 124 直接
          # 中止 shell，存活判定恒假。
          docker run --rm quickquip:smoke sh -c 'timeout -k 5 15 python -u bot.py; [ $? -eq 124 ]'
          docker run --rm --shm-size=1g quickquip:smoke python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True, args=['--no-sandbox']); browser.close(); p.stop()"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Record candidate identity
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/ci/release_identity.py

      - name: Checkout upgrade baseline
        uses: actions/checkout@v7
        with:
          ref: v1.16.3
          path: baseline

      - name: Verify image upgrade and rollback
        run: |
          python scripts/ci/verify_release_upgrade.py --baseline baseline --installation upgrade-install --image quickquip:smoke
          docker image inspect quickquip:smoke > release-image.json
          docker run --rm quickquip:smoke python -m pip freeze > release-dependencies.txt

      - name: Retain Docker acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-release-evidence
          path: |
            release-identity.json
            release-image.json
            release-dependencies.txt
            upgrade-install/data/release-*.log
            upgrade-install/data/release-*.json

