name: Bug 报告 / Bug report
description: 报告可复现的缺陷 / Report a reproducible defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前先搜索既有 issue；对已有 issue 点 👍 即可，不必重复开单。
        文字优于截图 / Prefer text over screenshots.
  - type: textarea
    id: phenomenon
    attributes:
      label: 现象 / Phenomenon
      description: 发生了什么？哪里与预期不符？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现 / Reproduction
      description: 精确的操作步骤、触发的指令与相关配置。
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: 渠道 / Channel
      description: 从哪个分发渠道安装的？
      options:
        - Docker 镜像 / Docker image
        - Windows 懒人包 / Windows bundle
        - 源码运行 / source checkout
        - 其他 / other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 所用 tag 或 commit；源码部署可填 `git describe --tags`，懒人包按 Release 名称。
  - type: input
    id: env
    attributes:
      label: 系统与协议端 / OS & protocol client
      placeholder: e.g. Ubuntu 24.04 + LLBot（Docker Compose）；Windows 11 + LLBot
  - type: input
    id: provider-model
    attributes:
      label: Provider / 模型（可选）
      description: 请隐去 API 密钥等敏感信息。
  - type: textarea
    id: expected
    attributes:
      label: 期望 / Expected
      description: 正确的行为应该是什么？
  - type: textarea
    id: notes
    attributes:
      label: 附注 / Notes
      description: 相关日志（Web Admin 日志浏览或容器日志）与配置片段；请脱敏 API 密钥、token、群号与 QQ 号。
