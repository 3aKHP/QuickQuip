# ── QuickQuip Docker Compose ─────────────────────────────────────────────
# 将所有 ${VAR} 替换为实际值或创建 .env 文件后运行：
#   docker compose up -d
#
# 仅启动 Bot + Web Admin：
#   docker compose up -d quickquip web-admin
#
# MCP sidecar 请参考 docker/mcp-example.Dockerfile.example 和 config/llm.toml.example
# 在自己的部署编排中添加。

name: quickquip

services:
  # ── QQ 协议适配器（LLBot）───────────────────────────────────────────────
  # 参考：https://github.com/LLOneBot/LuckyLilliaBot
  # 登录态 / 设备指纹保存在 llbot-qq/，切勿丢失否则 QQ 视作新设备。
  llbot:
    image: initialencounter/llonebot:v7.12.14-7.3.2-45758  # pin 说明见 docs/admin/deployment.md（latest 已漂移到需授权的 pmhq 8.x）
    container_name: llbot
    entrypoint:
      - /bin/sh
      - -c
      - "(sleep 5 && echo 'nameserver 127.0.0.11' > /etc/resolv.conf && echo 'options ndots:0' >> /etc/resolv.conf) & exec /bin/llonebot-service"
    environment:
      - QUICK_LOGIN_QQ=${QQ_ACCOUNT:?请设置 QQ 号}
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:3001:3001"       # OneBot WebSocket（正向，备用）
      - "127.0.0.1:3080:3080"       # WebUI（扫码登录 / 配置管理）
    volumes:
      - ./llbot-qq:/root/.config/QQ        # 登录态持久化（关键）
      - ./llbot-data:/root/llonebot         # 配置文件 + 运行时数据
    restart: unless-stopped

  # ── 联网搜索（SearXNG）──────────────────────────────────────────────────
  # 自动联网判定依赖此服务。如不需要，可注释掉并在 config/llm.toml 中
  # 将 auto_search.enabled 设为 false。
  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: quickquip-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND_ADDRESS:-127.0.0.1}:${SEARXNG_BIND_PORT:-8888}:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng:rw
    environment:
      FORCE_OWNERSHIP: "true"
      SEARXNG_BASE_URL: "${SEARXNG_PUBLIC_BASE_URL:-http://127.0.0.1:8888/}"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?请设置 SEARXNG_SECRET}"
      SEARXNG_LIMITER: "false"

  # ── QQ Bot ──────────────────────────────────────────────────────────────
  quickquip:
    image: ghcr.io/3akhp/quickquip:latest
    container_name: quickquip
    init: true
    depends_on:
      - llbot
      - searxng
    env_file:
      - .env
    environment:
      DRIVER: "${DRIVER:-~fastapi+~websockets}"
      HOST: "0.0.0.0"
      PORT: "8080"
      ONEBOT_WS_URLS: '${ONEBOT_WS_URLS:-["ws://llbot:3001/"]}'
      ONEBOT_ACCESS_TOKEN: "${ONEBOT_ACCESS_TOKEN:-}"
      SEARXNG_BASE_URL: "${QUICKQUIP_SEARXNG_BASE_URL:-http://searxng:8080}"
    shm_size: "1gb"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      # 群友身份与黑话词表（可选）。将 llm_about/vocab.yaml.example 和
      # llm_about/identities.yaml.example 复制为 .yaml 并编辑后，取消注释：
      # - ./llm_about:/app/llm_about:ro
      # 仅当 config/llm.toml 启用 docker transport MCP 时才挂载：
      # - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ── Web 管理后台 ────────────────────────────────────────────────────────
  # 与 quickquip 共用同一镜像，仅 command 不同。
  web-admin:
    image: ghcr.io/3akhp/quickquip:latest
    container_name: quickquip-web-admin
    init: true
    command: ["python", "-u", "web_api.py"]
    depends_on:
      - searxng
    env_file:
      - .env
    environment:
      WEB_ADMIN_HOST: "0.0.0.0"
      WEB_ADMIN_PORT: "5104"
      SEARXNG_BASE_URL: "${QUICKQUIP_SEARXNG_BASE_URL:-http://searxng:8080}"
    ports:
      - "127.0.0.1:5104:5104"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      # 群友身份（同上，可选）：
      # - ./llm_about:/app/llm_about
      # 仅当需要覆盖镜像内置前端时取消注释：
      # - ./frontend/dist:/app/frontend/dist:ro
    restart: unless-stopped

volumes:
  searxng-cache:
