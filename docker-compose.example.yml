# ── QuickQuip Docker Compose ─────────────────────────────────────────────
# 将所有 ${VAR} 替换为实际值或创建 .env 文件后运行：
#   docker compose up -d
#
# 最小部署（仅 Bot + Web Admin）：
#   docker compose up -d quickquip web-admin
#
# 完整部署（含搜索 + MCP sidecar）：
#   docker compose --profile full up -d

name: quickquip

services:
  # ── QQ 协议适配器（NapCat）─────────────────────────────────────────────
  # 参考：https://github.com/NapNeko/NapCatQQ
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    environment:
      - ACCOUNT=${QQ_ACCOUNT:?请设置 QQ 号}
      - WS_ENABLE=true
      - WS_HOST=0.0.0.0
      - WS_PORT=6099
    ports:
      - "127.0.0.1:6099:6099"
      - "127.0.0.1:3000:3000"
    volumes:
      - napcat-data:/app/napcat/config
    restart: unless-stopped

  # ── 联网搜索（SearXNG）──────────────────────────────────────────────────
  # 自动联网判定依赖此服务。如不需要，可注释掉并在 config/llm.toml 中
  # 将 auto_search.enabled 设为 false。
  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: quickquip-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND_ADDRESS:-127.0.0.1}:${SEARXNG_BIND_PORT:-8888}:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng:rw
    environment:
      FORCE_OWNERSHIP: "true"
      SEARXNG_BASE_URL: "${SEARXNG_PUBLIC_BASE_URL:-http://127.0.0.1:8888/}"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?请设置 SEARXNG_SECRET}"
      SEARXNG_LIMITER: "false"

  # ── QQ Bot ──────────────────────────────────────────────────────────────
  quickquip:
    image: ghcr.io/3aKHP/quickquip:latest
    container_name: quickquip
    depends_on:
      - napcat
    env_file:
      - .env
    environment:
      DRIVER: "${DRIVER:-~fastapi}"
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-8080}"
      ONEBOT_WS_URLS: '${ONEBOT_WS_URLS:-["ws://napcat:6099"]}'
      ONEBOT_ACCESS_TOKEN: "${ONEBOT_ACCESS_TOKEN:-}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://searxng:8080}"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      # 群友身份与黑话词表（可选）。将 llm_about/vocab.yaml.example 和
      # llm_about/identities.yaml.example 复制为 .yaml 并编辑后，取消注释：
      # - ./llm_about:/app/llm_about:ro
    restart: unless-stopped

  # ── Web 管理后台 ────────────────────────────────────────────────────────
  # 与 quickquip 共用同一镜像，仅 command 不同。
  web-admin:
    image: ghcr.io/3aKHP/quickquip:latest
    container_name: quickquip-web-admin
    command: ["python", "-u", "web_api.py"]
    env_file:
      - .env
    environment:
      WEB_ADMIN_HOST: "0.0.0.0"
      WEB_ADMIN_PORT: "5104"
    ports:
      - "127.0.0.1:5104:5104"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      # 群友身份（同上，可选）：
      # - ./llm_about:/app/llm_about:ro
      # 仅当需要覆盖镜像内置前端时取消注释：
      # - ./frontend/dist:/app/frontend/dist:ro
    restart: unless-stopped

  # ── MCP Sidecar：Tavily 搜索（可选）─────────────────────────────────────
  # 启用：docker compose --profile full up -d
  # 此服务将上游 stdio‑only 的 mcp/tavily 镜像通过 mcp‑proxy 封装为 HTTP，
  # 供 quickquip 通过 transport = "sse" 调用。
  mcp-tavily:
    build:
      context: .
      dockerfile: docker/mcp-tavily.Dockerfile
    container_name: quickquip-mcp-tavily
    profiles: ["full"]
    environment:
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
    restart: unless-stopped

  # ── MCP Sidecar：Fetch 网页抓取（可选）──────────────────────────────────
  mcp-fetch:
    build:
      context: .
      dockerfile: docker/mcp-fetch.Dockerfile
    container_name: quickquip-mcp-fetch
    profiles: ["full"]
    restart: unless-stopped

volumes:
  napcat-data:
  searxng-cache:
